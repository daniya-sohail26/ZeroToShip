<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Create your TradePost account and start bartering peer-to-peer for free."/>
  <title>TradePost — Create Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
</head>
<body>

<canvas id="particle-canvas" aria-hidden="true"></canvas>

<div class="auth-page">
  <div class="auth-card">
    <div class="auth-card__logo">
      <div class="logo-mark">T</div>
      <h2 style="margin-top:var(--sp-3)">Create your account</h2>
      <p style="color:var(--clr-muted);font-size:.9rem;margin-top:6px">Join the TradePost barter network</p>
    </div>

    <form id="form-register" style="display:flex;flex-direction:column;gap:var(--sp-4)">
      <div class="form-group">
        <label class="form-label" for="reg-username">Username</label>
        <input class="form-input" id="reg-username" type="text" placeholder="your_username"
               required minlength="3" autocomplete="username"/>
        <span class="form-hint">At least 3 characters</span>
      </div>
      <div class="form-group">
        <label class="form-label" for="reg-password">Password</label>
        <input class="form-input" id="reg-password" type="password" placeholder="••••••••"
               required minlength="6" autocomplete="new-password"/>
        <span class="form-hint">At least 6 characters</span>
        <!-- Password strength bar -->
        <div id="pw-strength-bar" style="margin-top:6px;height:3px;border-radius:3px;background:var(--clr-border);overflow:hidden;display:none">
          <div id="pw-strength-fill" style="height:100%;width:0%;border-radius:3px;transition:width .3s,background .3s"></div>
        </div>
        <span id="pw-strength-label" style="font-size:.7rem;color:var(--clr-muted);display:none"></span>
      </div>
      <p class="form-error" id="reg-error"></p>
      <button type="submit" class="btn btn-primary btn-full" id="btn-register" style="margin-top:var(--sp-2)">
        Create Account
      </button>
    </form>

    <div class="auth-divider">or</div>
    <p style="text-align:center;font-size:.875rem;color:var(--clr-muted)">
      Already have an account? <a href="{{ url_for('pages.login_page') }}">Log in</a>
    </p>
  </div>
</div>

<div class="toast-area" id="toast-area"></div>

<script>
  const APP = { token: localStorage.getItem('tp_token')||'', loggedIn: false };
</script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
<script>
// Password strength indicator
const pwInput  = document.getElementById('reg-password');
const pwBar    = document.getElementById('pw-strength-bar');
const pwFill   = document.getElementById('pw-strength-fill');
const pwLabel  = document.getElementById('pw-strength-label');

pwInput.addEventListener('input', function() {
  const val = this.value;
  if (!val) { pwBar.style.display = 'none'; pwLabel.style.display = 'none'; return; }
  pwBar.style.display  = 'block';
  pwLabel.style.display= 'block';
  let score = 0;
  if (val.length >= 6)  score++;
  if (val.length >= 10) score++;
  if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score++;
  if (/\d/.test(val))   score++;
  if (/[^A-Za-z0-9]/.test(val)) score++;
  const configs = [
    { width:'20%', color:'#ef4444', label:'Very Weak' },
    { width:'40%', color:'#f97316', label:'Weak' },
    { width:'60%', color:'#f59e0b', label:'Fair' },
    { width:'80%', color:'#22c55e', label:'Strong' },
    { width:'100%',color:'#10b981', label:'Very Strong' },
  ];
  const c = configs[Math.min(score, 4)];
  pwFill.style.width      = c.width;
  pwFill.style.background = c.color;
  pwLabel.textContent     = c.label;
  pwLabel.style.color     = c.color;
});

document.getElementById('form-register').addEventListener('submit', async function(e) {
  e.preventDefault();
  const btn   = document.getElementById('btn-register');
  const errEl = document.getElementById('reg-error');
  errEl.classList.remove('show');
  btn.innerHTML = '<span class="spinner"></span> Creating…';
  btn.disabled  = true;

  const resp = await fetch('/auth/register', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      username: document.getElementById('reg-username').value.trim(),
      password: document.getElementById('reg-password').value,
    })
  });
  const data = await resp.json();

  if (resp.ok) {
    localStorage.setItem('tp_token',    data.token);
    localStorage.setItem('tp_user_id',  data.user.user_id);
    localStorage.setItem('tp_username', data.user.username);
    document.cookie = `tp_token=${data.token}; path=/; SameSite=Lax`;
    window.location.href = '/';
  } else {
    errEl.textContent = data.error || 'Registration failed.';
    errEl.classList.add('show');
    btn.innerHTML = 'Create Account';
    btn.disabled  = false;
  }
});
</script>
</body>
</html>
